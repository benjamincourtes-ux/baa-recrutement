<style>
* { box-sizing:border-box; margin:0; padding:0; }
body { font-family:Arial,sans-serif; background:#f8f3ee; color:#3a3a3a; }
.hero { background:linear-gradient(135deg,#c9a86a,#f5d48a); padding:40px 20px; text-align:center; }

.hero h1 { color:#1a0a00; font-size:22px; margin-bottom:6px; }

.card { background:white; border-radius:16px; padding:20px; margin-bottom:16px; border:1px solid #e8d4b0; }

.stat-grid { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.stat { background:#f8f3ee; border-radius:12px; padding:14px; text-align:center; }

.sim-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:#c9a86a; cursor:pointer; }
.sim-value { color:#c9a86a; font-size:13px; font-weight:bold; text-align:right; margin-bottom:14px; }
.result-box { background:linear-gradient(135deg,#c9a86a,#f5d48a); border-radius:12px; padding:16px; text-align:center; margin-top:8px; }
.result-box p { color:#1a0a00; font-size:13px; margin-bottom:4px; }
.result-box .big { font-size:28px; font-weight:bold; }
.result-box .palier-actuel { font-size:12px; opacity:0.7; margin-top:4px; }
.temoignage { background:#f8f3ee; border-radius:12px; padding:14px; margin-bottom:10px; border-left:3px solid #c9a86a; }
.temoignage p { color:#555; font-size:13px; line-height:1.6; font-style:italic; }
.temoignage span { color:#8b735d; font-size:12px; font-weight:bold; display:block; margin-top:6px; }
.form-group { margin-bottom:12px; }
.form-group label { color:#8b735d; font-size:12px; font-weight:bold; display:block; margin-bottom:4px; }
.form-group input, .form-group textarea { width:100%; padding:12px; border:1px solid #e8d4b0; border-radius:10px; font-size:14px; background:white; }
.btn-main { width:100%; background:linear-gradient(135deg,#c9a86a,#f5d48a); color:#1a0a00; border:none; padding:16px; border-radius:14px; font-weight:bold; font-size:16px; cursor:pointer; touch-action:manipulation; margin-bottom:10px; }
.btn-boutique { width:100%; background:white; color:#8b735d; border:2px solid #c9a86a; padding:14px; border-radius:14px; font-weight:bold; font-size:14px; cursor:pointer; touch-action:manipulation; text-decoration:none; display:block; text-align:center; }
.avantage { display:flex; align-items:flex-start; gap:12px; margin-bottom:12px; }
.avantage-icon { font-size:28px; flex-shrink:0; }
.avantage-text h3 { color:#3a3a3a; font-size:14px; font-weight:bold; margin-bottom:3px; }
.avantage-text p { color:#999; font-size:13px; line-height:1.5; }
.loading { text-align:center; padding:60px 20px; color:#8b735d; }
.footer { text-align:center; padding:20px; color:#999; font-size:12px; }
</style>
</head>
<body>

<div id="app"><div class="loading">⏳ Chargement...</div></div>

<script>
var firebaseConfig = {
  apiKey: "AIzaSyC94wzVrEtrqxhshdFsRHR7HiL5wJEkYG0",
  authDomain: "beauty-addict-academy.firebaseapp.com",
  projectId: "beauty-addict-academy",
  storageBucket: "beauty-addict-academy.firebasestorage.app",
  messagingSenderId: "311669980538",
  appId: "1:311669980538:web:eaf8a95e987473c6412ac3"
};
firebase.initializeApp(firebaseConfig);
var db = firebase.firestore();
emailjs.init("D_JtKhPDgOQWi_ECO");

var PALIERS = [
  {nom:"Consultant",min:100,max:249,comm:20,equipe:2},
  {nom:"Conseiller",min:250,max:499,comm:30,equipe:4},
  {nom:"Conseiller Principal",min:500,max:999,comm:30,equipe:6},
  {nom:"Responsable",min:1000,max:1499,comm:30,equipe:8},
  {nom:"Cadre Supérieur",min:1500,max:1999,comm:30,equipe:10},
  {nom:"Partenaire",min:2000,max:2999,comm:30,equipe:12},
  {nom:"Directeur Adjoint",min:3000,max:4999,comm:30,equipe:14},
  {nom:"Directeur",min:5000,max:99999,comm:30,equipe:17},
];

function getPalier(ca) {
  for (var i=PALIERS.length-1;i>=0;i--) { if (ca >= PALIERS[i].min) return PALIERS[i]; }
  return {nom:"Débutante",min:0,max:99,comm:20,equipe:0};
}

function getUid() { return new URLSearchParams(window.location.search).get("uid"); }

function renderPage(b) {
  var uid = getUid();
  var app = document.getElementById("app");
  app.innerHTML = "";

  // HERO
  var hero = document.createElement("div"); hero.className="hero";
  if (b.photoProfil) { var img=document.createElement("img"); img.src=b.photoProfil; img.className="hero-photo"; hero.appendChild(img); }
  hero.innerHTML += "<h1>Rejoins l'équipe de " + (b.prenom||"votre conseillère") + " ! 🌿</h1><p>Crée ta propre boutique en ligne gratuite<br>et développe ton business beauté depuis chez toi</p>";
  app.appendChild(hero);

  var section = document.createElement("div"); section.className="section";

  // BOUTIQUE DEMO
  var boutiqueCard = document.createElement("div"); boutiqueCard.className="card";
  boutiqueCard.innerHTML="<h2>🛍️ Ta boutique en ligne offerte</h2><p style='color:#666;font-size:13px;line-height:1.6;margin-bottom:14px;'>Chez Mihi, la boutique en ligne coûte cher. Avec notre académie, tu l'as <strong>gratuitement</strong> — personnalisée avec tes photos, tes produits, tes prix.</p>";
  var demoBtn = document.createElement("a"); demoBtn.href="https://baa-vitrine.vercel.app/?uid="+uid; demoBtn.target="_blank"; demoBtn.className="btn-boutique"; demoBtn.textContent="👀 Voir la boutique de "+( b.prenom||"votre conseillère");
  boutiqueCard.appendChild(demoBtn); section.appendChild(boutiqueCard);

  // AVANTAGES
  var avCard = document.createElement("div"); avCard.className="card";
  avCard.innerHTML="<h2>✨ Ce que tu obtiens</h2>";
  var avantages = [
    {icon:"🛍️", titre:"Boutique en ligne gratuite", desc:"Personnalisée, avec diagnostics IA, carte de fidélité, paniers partagés..."},
    {icon:"📱", titre:"Académie Beauty Addict", desc:"Formations, outils, quiz, badges, suivi de ton activité — tout dans une app"},
    {icon:"💰", titre:"20% à 30% de commission", desc:"Sur tes propres ventes + jusqu'à 17% sur les ventes de ton équipe"},
    {icon:"🎯", titre:"Accompagnement personnalisé", desc:"Tu n'es jamais seule — je t'accompagne à chaque étape de ton développement"},
    {icon:"⏰", titre:"100% flexible", desc:"Tu travailles quand tu veux, où tu veux, à ton rythme"},
    {icon:"🌿", titre:"Produits cosmétiques premium", desc:"Gamme complète visage, corps, cheveux, maquillage — made in Europe"},
  ];
  avantages.forEach(function(av){
    var d=document.createElement("div");d.className="avantage";
    d.innerHTML="<span class='avantage-icon'>"+av.icon+"</span><div class='avantage-text'><h3>"+av.titre+"</h3><p>"+av.desc+"</p></div>";
    avCard.appendChild(d);
  });
  section.appendChild(avCard);

  // PROFILS RÉELS
  var profilsCard = document.createElement("div"); profilsCard.className="card";
  profilsCard.innerHTML="<h2>💰 Elles ont sauté le pas — voilà ce qu'elles gagnent</h2>";

  var profils = [
    {emoji:"👩", prenom:"Marie", job:"Coiffeuse", temps:"6h/semaine", clientes:"12 clientes régulières", gain:"420"},
    {emoji:"👩", prenom:"Julie", job:"Maman au foyer", temps:"4h/semaine", clientes:"8 clientes", gain:"320"},
    {emoji:"👩", prenom:"Sarah", job:"Salariée", temps:"8h/semaine", clientes:"20 clientes", gain:"790"},
  ];

  profils.forEach(function(p) {
    var card = document.createElement("div");
    card.style.cssText = "background:#f8f3ee;border-radius:12px;padding:16px;margin-bottom:12px;border:1px solid #e8d4b0;display:flex;align-items:center;gap:14px;";
    card.innerHTML = "<div style='font-size:36px;flex-shrink:0;'>"+p.emoji+"</div><div style='flex:1;'><p style='color:#3a3a3a;font-size:14px;font-weight:bold;margin:0 0 2px;'>"+p.prenom+" — "+p.job+"</p><p style='color:#999;font-size:12px;margin:0 0 6px;'>"+p.temps+" • "+p.clientes+"</p><p style='color:#c9a86a;font-size:20px;font-weight:bold;margin:0;'>"+p.gain+" €<span style='color:#999;font-size:12px;font-weight:normal;'>/mois</span></p></div>";
    profilsCard.appendChild(card);
  });

  var noteP = document.createElement("p"); noteP.style.cssText="color:#999;font-size:11px;text-align:center;margin:8px 0 0;font-style:italic;"; noteP.textContent="Revenus moyens constatés dans notre équipe. Les résultats varient selon l'investissement personnel.";
  profilsCard.appendChild(noteP);
  section.appendChild(profilsCard);

  // PALIERS
  var palierCard=document.createElement("div");palierCard.className="card";
  palierCard.innerHTML="<h2>🏆 Les statuts Mihi</h2>";
  PALIERS.forEach(function(p){
    var row=document.createElement("div");row.className="palier";
    row.innerHTML="<div><p class='palier-nom'>"+p.nom+"</p><p class='palier-ca'>"+p.min.toLocaleString("fr-FR")+"€"+(p.max<99999?" → "+p.max.toLocaleString("fr-FR")+"€":" et +")+"</p></div><p class='palier-comm'>"+p.comm+"% + "+p.equipe+"% équipe</p>";
    palierCard.appendChild(row);
  });
  section.appendChild(palierCard);

  // TEMOIGNAGES
  var temCard=document.createElement("div");temCard.className="card";
  temCard.innerHTML="<h2>💬 Elles ont sauté le pas</h2>";
  var temoignages=[
    {texte:"Je n'aurais jamais pensé pouvoir avoir ma propre boutique en ligne. Aujourd'hui mes clientes commandent directement et je reçois une notification à chaque vente !", nom:"Sarah, 3 mois dans l'équipe"},
    {texte:"L'académie m'a tout appris. Les formations, les outils, l'accompagnement — je me sens vraiment professionnelle dans ma façon de travailler.", nom:"Léa, 6 mois dans l'équipe"},
    {texte:"Ce qui m'a convaincue c'est la boutique gratuite. Chez Mihi elle est payante, ici elle est offerte et en plus elle est magnifique !", nom:"Marine, 1 an dans l'équipe"},
  ];
  temoignages.forEach(function(t){
    var div=document.createElement("div");div.className="temoignage";
    div.innerHTML="<p>"+t.texte+"</p><span>— "+t.nom+"</span>";
    temCard.appendChild(div);
  });
  section.appendChild(temCard);

  // COMPTEUR ÉQUIPE + URGENCE
  var urgenceCard = document.createElement("div"); urgenceCard.className="card";
  urgenceCard.style.cssText += "background:linear-gradient(135deg,#1a0a00,#3a1a00);border:none;";
  urgenceCard.innerHTML = "<p style='color:#f5d48a;font-size:11px;font-weight:bold;margin:0 0 8px;letter-spacing:2px;text-align:center;'>🔥 CE MOIS-CI</p><div style='display:flex;gap:12px;margin-bottom:14px;'><div style='flex:1;background:rgba(255,255,255,0.1);border-radius:10px;padding:12px;text-align:center;'><p style='color:#f5d48a;font-size:32px;font-weight:bold;margin:0;'>2</p><p style='color:rgba(255,255,255,0.7);font-size:11px;margin:0;'>Personnes ont rejoint l'équipe</p></div><div style='flex:1;background:rgba(255,255,255,0.1);border-radius:10px;padding:12px;text-align:center;'><p style='color:#ff6b6b;font-size:32px;font-weight:bold;margin:0;'>3</p><p style='color:rgba(255,255,255,0.7);font-size:11px;margin:0;'>Places restantes ce mois</p></div></div><p style='color:rgba(255,255,255,0.6);font-size:11px;text-align:center;margin:0;font-style:italic;'>Benjamin accompagne personnellement chaque nouvelle recrue</p>";
  section.appendChild(urgenceCard);

  // OBJECTIONS
  var objCard = document.createElement("div"); objCard.className="card";
  objCard.innerHTML = "<h2>🤔 Tu te poses sûrement ces questions...</h2>";

  var objections = [
    {
      q: "C'est du MLM, c'est une arnaque ?",
      r: "Mihi est une entreprise française fondée en mai 2022, enregistrée et réglementée. Nos produits sont conçus dans le laboratoire pharmaceutique Elfa Pharm, garantissant une qualité irréprochable. Plus de 4 millions d'euros ont déjà été reversés à nos ambassadeurs. Pas de stock obligatoire, pas de frais cachés, pas de pression. Tu vends quand tu veux, depuis ta boutique en ligne."
    },
    {
      q: "Je n'ai pas de réseau...",
      r: "Moi non plus au départ ! Avec ta boutique en ligne tu n'as pas besoin de réseau existant — tes futures clientes te trouveront toutes seules. Et tu n'es jamais seule : tu es formée dès le premier jour, accompagnée pas à pas, et tu as accès à l'Académie Beauty Addict et toute une équipe là pour t'aider à te développer."
    },
    {
      q: "Je n'y connais rien en cosmétiques...",
      r: "C'est là que notre équipe fait la différence ! L'Académie Beauty Addict a été créée par un maquilleur professionnel diplômé qui met toute son expertise en maquillage et cosmétique à ta disposition. Dès ton arrivée tu accèdes à toutes ses formations et à son expérience — tu deviens experte plus vite que tu ne le crois."
    }
  ];

  objections.forEach(function(obj) {
    var objDiv = document.createElement("div");
    objDiv.style.cssText = "background:#f8f3ee;border-radius:12px;padding:16px;margin-bottom:12px;cursor:pointer;border:1px solid #e8d4b0;";
    var qEl = document.createElement("div");
    qEl.style.cssText = "display:flex;justify-content:space-between;align-items:center;";
    qEl.innerHTML = "<p style='color:#3a3a3a;font-size:14px;font-weight:bold;margin:0;flex:1;'>❓ "+obj.q+"</p><span style='color:#c9a86a;font-size:20px;margin-left:10px;transition:transform 0.3s;'>›</span>";
    var rEl = document.createElement("p");
    rEl.style.cssText = "color:#555;font-size:13px;line-height:1.7;margin:10px 0 0;display:none;";
    rEl.textContent = obj.r;
    objDiv.appendChild(qEl); objDiv.appendChild(rEl);
    objDiv.onclick = function() {
      var isOpen = rEl.style.display !== "none";
      rEl.style.display = isOpen ? "none" : "block";
      qEl.querySelector("span").style.transform = isOpen ? "rotate(0deg)" : "rotate(90deg)";
    };
    objCard.appendChild(objDiv);
  });
  section.appendChild(objCard);

  // FORMULAIRE
  var formCard=document.createElement("div");formCard.className="card";
  formCard.innerHTML="<h2>🚀 Je veux ma boutique gratuite !</h2><p style='color:#666;font-size:13px;margin-bottom:16px;line-height:1.5;'>Laisse tes coordonnées et "+( b.prenom||"ta conseillère")+" te contacte dans les 24h pour tout t'expliquer.</p>";

  var fields=[
    {id:"r-prenom",label:"Prénom *",type:"text",placeholder:"Ton prénom"},
    {id:"r-nom",label:"Nom *",type:"text",placeholder:"Ton nom"},
    {id:"r-email",label:"Email *",type:"email",placeholder:"Ton adresse email"},
    {id:"r-tel",label:"Téléphone *",type:"tel",placeholder:"Ton numéro de téléphone"},
  ];
  fields.forEach(function(f){
    var g=document.createElement("div");g.className="form-group";
    g.innerHTML="<label>"+f.label+"</label><input type='"+f.type+"' id='"+f.id+"' placeholder='"+f.placeholder+"'>";
    formCard.appendChild(g);
  });

  var motivLabel=document.createElement("div");motivLabel.className="form-group";
  motivLabel.innerHTML="<label>Qu'est-ce qui t'attire dans cette opportunité ?</label><textarea id='r-motiv' placeholder='Dis-nous en quelques mots...' rows='3' style='resize:none;'></textarea>";
  formCard.appendChild(motivLabel);

  var errEl=document.createElement("p");errEl.style.cssText="color:#e74c3c;font-size:12px;margin-bottom:8px;display:none;";formCard.appendChild(errEl);

  var submitBtn=document.createElement("button");submitBtn.className="btn-main";submitBtn.textContent="🌿 Je veux rejoindre l'équipe !";
  submitBtn.onclick=function(){
    var prenom=document.getElementById("r-prenom").value.trim();
    var nom=document.getElementById("r-nom").value.trim();
    var email=document.getElementById("r-email").value.trim();
    var tel=document.getElementById("r-tel").value.trim();
    var motiv=document.getElementById("r-motiv").value.trim();
    if(!prenom||!nom||!email||!tel){errEl.textContent="Merci de remplir tous les champs obligatoires.";errEl.style.display="block";return;}
    submitBtn.disabled=true;submitBtn.textContent="⏳ Envoi en cours...";

    // Sauvegarder dans Firebase
    db.collection("prospects_recrutement").add({
      prenom:prenom,nom:nom,email:email,tel:tel,motiv:motiv,
      boutiqueUid:uid,vdiPrenom:b.prenom||"",
      date:new Date().toISOString(),statut:"nouveau"
    }).then(function(){
      // Envoyer email à la VDI
      if(b.emailVdi){
      emailjs.send("service_wr9mlhk","template_s0huhum",{
          vdi_prenom:b.prenom||"Conseillère",
          to_email:b.emailVdi,
          prospect_prenom:prenom,
          prospect_nom:nom,
          prospect_email:email,
          prospect_tel:tel,
          prospect_motiv:motiv||"Non renseignée"
        });
      }
      // Afficher confirmation
      formCard.innerHTML="<div style='text-align:center;padding:20px 0;'><p style='font-size:50px;margin-bottom:12px;'>🎉</p><h2 style='color:#27AE60;margin-bottom:8px;'>Super "+prenom+" !</h2><p style='color:#666;font-size:14px;line-height:1.6;'>"+( b.prenom||"Ta conseillère")+" va te contacter très vite pour tout t'expliquer.<br><br>En attendant, tu peux découvrir à quoi ressemblera ta boutique !</p></div>";
      var discBtn=document.createElement("a");discBtn.href="https://baa-vitrine.vercel.app/?uid="+uid;discBtn.target="_blank";discBtn.className="btn-boutique";discBtn.style.marginTop="12px";discBtn.textContent="👀 Découvrir ma future boutique";
      if(b.lienParrainage){var parBtn=document.createElement("a");parBtn.href=b.lienParrainage;parBtn.target="_blank";parBtn.className="btn-main";parBtn.style.cssText="display:block;text-align:center;text-decoration:none;margin-top:10px;padding:16px;border-radius:14px;background:linear-gradient(135deg,#c9a86a,#f5d48a);color:#1a0a00;font-weight:bold;";parBtn.textContent="✅ Je m'inscris maintenant sur Mihi";formCard.appendChild(parBtn);}
      formCard.appendChild(discBtn);
    }).catch(function(){errEl.textContent="Erreur lors de l'envoi. Réessaie.";errEl.style.display="block";submitBtn.disabled=false;submitBtn.textContent="🌿 Je veux rejoindre l'équipe !";});
  };
  submitBtn.addEventListener("touchend",function(e){e.preventDefault();submitBtn.onclick();},{passive:false});
  formCard.appendChild(submitBtn);

  if(b.lienParrainage){
    var dejaPret=document.createElement("p");dejaPret.style.cssText="text-align:center;color:#999;font-size:12px;margin-top:10px;";dejaPret.textContent="Tu es déjà prête à démarrer ?";formCard.appendChild(dejaPret);
    var directBtn=document.createElement("a");directBtn.href=b.lienParrainage;directBtn.target="_blank";directBtn.className="btn-boutique";directBtn.style.marginTop="6px";directBtn.textContent="✅ M'inscrire directement sur Mihi";formCard.appendChild(directBtn);
  }
  section.appendChild(formCard);

  var footer=document.createElement("div");footer.className="footer";footer.innerHTML="🐦‍🔥 Beauty Addict Academy • Équipe de "+(b.prenom||"votre conseillère");
  section.appendChild(footer);

  app.appendChild(section);
}

// Charger les données de la VDI
var uid = getUid();
if (uid) {
  db.collection("boutiques").doc(uid).get().then(function(snap) {
    if (snap.exists) {
      renderPage(snap.data());
      // Enregistrer la visite du tunnel
      try {
        db.collection("boutiques").doc(uid).collection("stats").doc("recrutement").set({
          visites: firebase.firestore.FieldValue.increment(1),
          derniereVisite: new Date().toISOString()
        }, {merge:true});
      } catch(e) {}
    }
    else { document.getElementById("app").innerHTML="<div class='loading'>Lien invalide.</div>"; }
  });
} else {
  document.getElementById("app").innerHTML="<div class='loading'>Lien invalide.</div>";
}
</script>
</body>
</html>
