  var maintenant = new Date();
  var debutMois = new Date(maintenant.getFullYear(), maintenant.getMonth(), 1).toISOString();
  db.collection("users").where("accountStatus","==","active").where("createdAt",">=",debutMois).get().then(function(snap){
    var nbRecrues = snap.size;
    var nbPlaces = Math.max(0, PLACES_MAX - nbRecrues);
    var elRecrues = document.getElementById("nb-recrues");
    var elPlaces = document.getElementById("nb-places");
    if (elRecrues) elRecrues.textContent = nbRecrues;
    if (elPlaces) {
      elPlaces.textContent = nbPlaces;
      elPlaces.style.color = nbPlaces <= 2 ? "#e74c3c" : "#27AE60";
    }
  }).catch(function(){
    // Si l'index n'existe pas, afficher des valeurs par défaut
    var elRecrues = document.getElementById("nb-recrues");
    var elPlaces = document.getElementById("nb-places");
    if (elRecrues) elRecrues.textContent = "3";
    if (elPlaces) elPlaces.textContent = "3";
  });

  // AVIS MEMBRES
  var avisCard = document.createElement("div"); avisCard.className="card";
  avisCard.innerHTML="<h2>⭐ Ce que disent nos membres</h2><div id='avis-list'><p style='color:#999;font-size:13px;text-align:center;padding:10px;'>Chargement des avis...</p></div>";
  section.appendChild(avisCard);

  db.collection("avis").where("valide","==",true).orderBy("createdAt","desc").limit(6).get().then(function(snap) {
    var list = document.getElementById("avis-list"); if (!list) return;
    if (snap.empty) { list.innerHTML="<p style='color:#999;font-size:13px;text-align:center;'>Sois la première à laisser un avis !</p>"; return; }
    list.innerHTML = "";
    snap.forEach(function(doc) {
      var a = doc.data();
      var etoiles = "";
      for (var i=1;i<=5;i++) { etoiles += i<=a.note ? "⭐" : "☆"; }
      var div = document.createElement("div");
      div.style.cssText = "background:#f8f3ee;border-radius:12px;padding:14px;margin-bottom:10px;border-left:3px solid #c9a86a;";
      div.innerHTML = "<div style='display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;'><span style='font-size:16px;'>"+etoiles+"</span><span style='color:#8b735d;font-size:11px;font-weight:bold;'>"+( a.prenom||"Membre")+"</span></div><p style='color:#555;font-size:13px;line-height:1.6;font-style:italic;margin:0;'>\""+a.texte+"\"</p>";
      list.appendChild(div);
    });
  }).catch(function(){ 
    var list = document.getElementById("avis-list"); 
    if (list) list.innerHTML="<p style='color:#999;font-size:13px;text-align:center;'>Avis bientôt disponibles !</p>"; 
  });

  // FORMULAIRE
  var formCard=document.createElement("div");formCard.className="card";
  formCard.style.cssText+="background:linear-gradient(135deg,#f8f3ee,#f3e7d3);";
  formCard.innerHTML="<h2>🎁 Obtiens ta boutique gratuite</h2><p style='color:#666;font-size:13px;margin-bottom:16px;line-height:1.6;'>Remplis ce formulaire et je te contacte dans les 24h pour tout t'expliquer !</p>";
  var fields=[
    {id:"f-prenom",label:"Ton prénom *",type:"text",placeholder:"Marie"},
    {id:"f-email",label:"Ton email *",type:"email",placeholder:"marie@exemple.fr"},
    {id:"f-tel",label:"Ton téléphone",type:"tel",placeholder:"06 xx xx xx xx"},
    {id:"f-message",label:"Une question ou motivation ?",type:"textarea",placeholder:"Ex: Je cherche un complément de revenus..."},
  ];
  fields.forEach(function(f){
    var fg=document.createElement("div");fg.className="form-group";
    fg.innerHTML="<label>"+f.label+"</label>";
    var inp;
    if(f.type==="textarea"){inp=document.createElement("textarea");inp.rows=3;}
    else{inp=document.createElement("input");inp.type=f.type;}
    inp.id=f.id;inp.placeholder=f.placeholder;
    fg.appendChild(inp);formCard.appendChild(fg);
  });
  var submitBtn=document.createElement("button");submitBtn.className="btn-main";submitBtn.textContent="🌿 Je veux ma boutique gratuite !";
  var submitMsg=document.createElement("p");submitMsg.style.cssText="text-align:center;font-size:13px;color:#8b735d;margin-top:8px;";
  submitBtn.onclick=function(){
    var prenom=document.getElementById("f-prenom").value.trim();
    var email=document.getElementById("f-email").value.trim();
    if(!prenom||!email){submitMsg.textContent="Merci de remplir au moins ton prénom et ton email.";return;}
    submitBtn.disabled=true;submitBtn.textContent="⏳ Envoi en cours...";
    var tel=document.getElementById("f-tel").value.trim();
    var message=document.getElementById("f-message").value.trim();
    db.collection("prospects_recrutement").add({
      prenom:prenom,email:email,tel:tel,motiv:message,
      boutiqueUid:uid,date:new Date().toISOString(),statut:"nouveau"
    }).then(function(){
      emailjs.send("service_wr9mlhk","template_s0huhum",{
        vdi_prenom:b.prenom||"",vdi_email:b.emailVdi||"",
        prospect_prenom:prenom,prospect_email:email,prospect_tel:tel,prospect_message:message
      }).catch(function(){});
      db.collection("boutiques").doc(uid).collection("stats").doc("recrutement").set({
        visites:firebase.firestore.FieldValue.increment(0),
        derniereInscription:new Date().toISOString()
      },{merge:true}).catch(function(){});
      formCard.innerHTML="<div style='text-align:center;padding:20px;'><p style='font-size:48px;margin-bottom:12px;'>🎉</p><h2 style='color:#27AE60;margin-bottom:8px;'>Demande envoyée !</h2><p style='color:#666;font-size:14px;line-height:1.6;'>Merci "+prenom+" ! Je te contacte dans les 24h pour tout t'expliquer et te donner accès à ta boutique gratuite 🌿</p></div>";
    }).catch(function(e){submitMsg.textContent="Erreur. Réessaie.";submitBtn.disabled=false;submitBtn.textContent="🌿 Je veux ma boutique gratuite !";});
  };
  formCard.appendChild(submitBtn);formCard.appendChild(submitMsg);section.appendChild(formCard);

  // LIEN PARRAINAGE
  if(b.lienParrainage){
    var parrainCard=document.createElement("div");parrainCard.className="card";parrainCard.style.cssText+="text-align:center;";
    parrainCard.innerHTML="<h2>🔗 Tu préfères t'inscrire directement ?</h2><p style='color:#666;font-size:13px;margin-bottom:14px;line-height:1.6;'>Tu peux aussi rejoindre directement via le site Mihi avec mon lien de parrainage :</p>";
    var parrainBtn=document.createElement("a");parrainBtn.href=b.lienParrainage;parrainBtn.target="_blank";parrainBtn.className="btn-main";parrainBtn.style.cssText+="display:block;text-decoration:none;text-align:center;";
    parrainBtn.textContent=b.texteParrainage||"Rejoins mon équipe 🐦‍🔥";
    parrainCard.appendChild(parrainBtn);section.appendChild(parrainCard);
  }

  // FOOTER
  var footer=document.createElement("div");footer.className="footer";
  footer.innerHTML="<p>Plateforme créée par "+( b.prenom||"votre conseillère")+" — Conseillère indépendante Mihi</p><p style='margin-top:4px;'>Cette page n'est pas le site officiel Mihi</p>";
  section.appendChild(footer);

  app.appendChild(section);

  // Enregistrer la visite
  db.collection("boutiques").doc(uid).collection("stats").doc("recrutement").set({
    visites:firebase.firestore.FieldValue.increment(1),
    derniereVisite:new Date().toISOString()
  },{merge:true}).catch(function(){});
}

// Charger les données
var uid = getUid();
if (!uid) {
  document.getElementById("app").innerHTML = "<div style='text-align:center;padding:60px 20px;'><p style='color:#e74c3c;font-size:16px;'>Lien invalide. Demande le lien correct à ta conseillère.</p></div>";
} else {
  db.collection("boutiques").doc(uid).get().then(function(snap) {
    if (!snap.exists || !snap.data().actif) {
      document.getElementById("app").innerHTML = "<div style='text-align:center;padding:60px 20px;'><p style='color:#8b735d;font-size:16px;'>Cette page n'est pas encore configurée.</p></div>";
      return;
    }
    renderPage(snap.data());
  }).catch(function(e) {
    document.getElementById("app").innerHTML = "<div style='text-align:center;padding:60px 20px;'><p style='color:#e74c3c;'>Erreur de chargement.</p></div>";
  });
}
</script>
</body>
</html>
